<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a8a7d"/>
    </marker>
    <marker id="note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- Controller region -->
  <rect x="20" y="150" width="960" height="195" fill="#d6e6fb" stroke="#222" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="385" y="140" width="230" height="22" rx="4" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="500" y="156" text-anchor="middle" font-size="13" fill="#1a8a7d">Extremum Seeking Controller</text>

  <!-- Plant row -->
  <rect x="330" y="68" width="135" height="36" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="397.5" y="91" text-anchor="middle" font-size="15" fill="#222">Objective</text>
  <rect x="590" y="68" width="125" height="36" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="652.5" y="91" text-anchor="middle" font-size="15" fill="#222">System</text>

  <!-- Plant signal paths -->
  <line x1="590" y1="86" x2="467" y2="86" stroke="#222" stroke-width="1.5" marker-end="url(#dark)"/>
  <polyline points="330,86 150,86 150,203" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#dark)"/>
  <polyline points="890,203 890,86 717,86" fill="none" stroke="#1a8a7d" stroke-width="1.5" marker-end="url(#teal)"/>

  <g font-family="'Times New Roman', Times, serif" font-style="italic" fill="#222">
    <text x="240" y="78" text-anchor="middle" font-size="18">ψ(y(θ))</text>
    <text x="528" y="78" text-anchor="middle" font-size="18">y(θ)</text>
    <text x="745" y="78" text-anchor="middle" font-size="18">θ</text>
  </g>

  <!-- Controller blocks -->
  <g fill="#eef6fd" stroke="#1a8a7d" stroke-width="1.5">
    <rect x="55" y="205" width="185" height="58" rx="2"/>
    <circle cx="335" cy="234" r="28"/>
    <rect x="430" y="205" width="185" height="58" rx="2"/>
    <rect x="675" y="205" width="125" height="58" rx="29"/>
    <circle cx="890" cy="234" r="28"/>
    <rect x="304" y="298" width="62" height="26" rx="4"/>
    <rect x="859" y="298" width="62" height="26" rx="4"/>
  </g>

  <g font-size="17" fill="#1a8a7d" text-anchor="middle">
    <text x="147.5" y="240">High-pass Filter</text>
    <text x="522.5" y="240">Low-pass Filter</text>
    <text x="737.5" y="240">Integrator</text>
  </g>
  <g font-family="'Times New Roman', Times, serif" font-size="26" fill="#222" text-anchor="middle">
    <text x="335" y="243">Π</text>
    <text x="890" y="243">Σ</text>
  </g>
  <g font-family="'Times New Roman', Times, serif" font-style="italic" font-size="14" fill="#222" text-anchor="middle">
    <text x="335" y="316">a sin(ωt)</text>
    <text x="890" y="316">a sin(ωt)</text>
  </g>

  <!-- Controller signal paths -->
  <g stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#dark)">
    <line x1="240" y1="234" x2="305" y2="234"/>
    <line x1="363" y1="234" x2="428" y2="234"/>
    <line x1="615" y1="234" x2="673" y2="234"/>
    <line x1="800" y1="234" x2="860" y2="234"/>
    <line x1="335" y1="298" x2="335" y2="264"/>
    <line x1="890" y1="298" x2="890" y2="264"/>
  </g>

  <g font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222" text-anchor="middle">
    <text x="272" y="224">ρ</text>
    <text x="396" y="224">σ</text>
    <text x="644" y="226">ξ</text>
    <text x="830" y="226">θ</text>
  </g>

  <g fill="none" stroke="#222" stroke-width="1.2">
    <path d="M639,209 L644,204 L649,209"/>
    <path d="M825,207 L830,202 L835,207"/>
  </g>

  <!-- Annotations -->
  <g font-size="11.5" fill="#1a8a7d">
    <text x="200" y="298" text-anchor="end">Demodulation</text>
    <text x="600" y="182" text-anchor="middle">Gradient Estimate</text>
    <text x="866" y="182" text-anchor="middle">Setpoint</text>
    <text x="760" y="302" text-anchor="middle">Perturbation</text>
  </g>
  <g fill="none" stroke="#444" stroke-width="1" marker-end="url(#note)">
    <path d="M205,294 C260,300 290,285 312,256"/>
    <path d="M608,187 C616,200 626,208 635,214"/>
    <path d="M866,187 C862,200 852,208 842,213"/>
    <path d="M760,290 C790,272 830,262 862,247"/>
  </g>

  <g font-size="11.5" fill="#222">
    <text x="130" y="30" text-anchor="middle">Objective Function</text>
    <text x="505" y="30" text-anchor="middle">System Output</text>
    <text x="820" y="30" text-anchor="middle">ES Output</text>
  </g>
  <g fill="none" stroke="#444" stroke-width="1" marker-end="url(#note)">
    <path d="M130,36 C140,60 180,68 212,72"/>
    <path d="M505,36 C505,50 515,56 522,62"/>
    <path d="M820,36 C815,58 790,70 760,74"/>
  </g>
</svg>
